<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>cmdze — создание сайтов</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0b10; font-family: 'Inter', sans-serif; color: #edf2ff; padding: 1.5rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #0e1018; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #2a2f42; }
        .price { font-size: 1.8rem; font-weight: bold; margin: 0.5rem 0; }
        button, .order-link { background: #3e6aff; border: none; color: white; padding: 0.8rem; border-radius: 2rem; font-size: 1rem; cursor: pointer; width: 100%; text-align: center; display: inline-block; text-decoration: none; margin-top: 0.5rem; }
        .order-form { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #2a2f42; display: none; }
        .order-form input, .order-form textarea { width: 100%; margin: 0.5rem 0; padding: 0.8rem; background: #12141f; border: 1px solid #262c3c; border-radius: 1rem; color: white; }
        .code-message { background: #1e2335; padding: 1rem; border-radius: 1rem; margin-top: 1rem; display: none; text-align: center; }
        .reviews-section, .chat-section { background: #0e1018; border-radius: 1.5rem; padding: 1.5rem; margin: 1.5rem 0; }
        .review-item { background: #080a0f; padding: 0.8rem; border-radius: 1rem; margin-bottom: 0.8rem; border-left: 3px solid #3e6aff; }
        .chat-message { background: #080a0f; padding: 0.8rem; border-radius: 1rem; margin-bottom: 0.8rem; }
        input, textarea, button { font-size: 16px; }
    </style>
</head>
<body>
<div class="container">
    <h1 style="margin-bottom: 1rem;">cmdze</h1>

    <!-- Карточка GTA -->
    <div class="card">
        <h2>GTA проекты</h2>
        <div class="price" id="price-gta">20 ₽</div>
        <button class="show-form-btn" data-product="gta">Заказать</button>
        <div id="form-gta" class="order-form">
            <input type="text" id="name-gta" placeholder="Ваше имя">
            <input type="text" id="contact-gta" placeholder="Контакт (Telegram, VK)">
            <textarea id="comment-gta" rows="2" placeholder="Пожелания"></textarea>
            <button class="send-order" data-product="gta">Отправить</button>
            <button class="cancel-form" data-product="gta">Отмена</button>
        </div>
        <div id="code-gta" class="code-message"></div>
    </div>

    <!-- Карточка Бизнес -->
    <div class="card">
        <h2>Малый бизнес</h2>
        <div class="price" id="price-business">40 ₽</div>
        <button class="show-form-btn" data-product="business">Заказать</button>
        <div id="form-business" class="order-form">
            <input type="text" id="name-business" placeholder="Ваше имя">
            <input type="text" id="contact-business" placeholder="Контакт (Telegram, VK)">
            <textarea id="comment-business" rows="2" placeholder="Пожелания"></textarea>
            <button class="send-order" data-product="business">Отправить</button>
            <button class="cancel-form" data-product="business">Отмена</button>
        </div>
        <div id="code-business" class="code-message"></div>
    </div>

    <!-- Карточка Форум -->
    <div class="card">
        <h2>Форумы</h2>
        <div class="price" id="price-forum">25 ₽</div>
        <button class="show-form-btn" data-product="forum">Заказать</button>
        <div id="form-forum" class="order-form">
            <input type="text" id="name-forum" placeholder="Ваше имя">
            <input type="text" id="contact-forum" placeholder="Контакт (Telegram, VK)">
            <textarea id="comment-forum" rows="2" placeholder="Пожелания"></textarea>
            <button class="send-order" data-product="forum">Отправить</button>
            <button class="cancel-form" data-product="forum">Отмена</button>
        </div>
        <div id="code-forum" class="code-message"></div>
    </div>

    <!-- Блок переписки (упрощённо) -->
    <div class="chat-section">
        <h3>Переписка по заказу</h3>
        <input type="text" id="ticketCodeInput" placeholder="Код из заказа" style="width:100%; margin-bottom:0.5rem; padding:0.8rem; background:#12141f; border-radius:1rem;">
        <button id="loadTicketBtn">Показать переписку</button>
        <div id="ticketMessages" style="margin-top:1rem;"></div>
        <div id="newMessageBlock" style="display:none; margin-top:1rem;">
            <textarea id="newMessageText" rows="2" placeholder="Ваше сообщение..." style="width:100%; padding:0.8rem; background:#12141f; border-radius:1rem;"></textarea>
            <button id="sendMessageBtn">Отправить</button>
        </div>
    </div>

    <!-- Блок отзывов -->
    <div class="reviews-section">
        <h3>Отзывы</h3>
        <div id="reviewsList">Загрузка...</div>
        <form id="reviewForm">
            <input type="text" id="reviewName" placeholder="Ваше имя" required>
            <textarea id="reviewText" rows="2" placeholder="Отзыв" required></textarea>
            <button type="submit">Оставить отзыв</button>
        </form>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://eymzqlswzzyogvsvgskl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5bXpxbHN3enp5b2d2c3Znc2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MzA4MjQsImV4cCI6MjA5MzIwNjgyNH0.W5ZXSFekPl7saDdaK-4YufmWlNWr5tdZsGtxy62gCVY';

    function escapeHtml(s) { return (s+'').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function generateCode() { return Math.random().toString(36).substring(2,10).toUpperCase(); }

    // Показать/скрыть форму
    document.querySelectorAll('.show-form-btn').forEach(btn => {
        btn.onclick = () => {
            const p = btn.dataset.product;
            const formDiv = document.getElementById(`form-${p}`);
            const codeDiv = document.getElementById(`code-${p}`);
            formDiv.style.display = formDiv.style.display === 'block' ? 'none' : 'block';
            if(codeDiv) codeDiv.style.display = 'none';
        };
    });
    document.querySelectorAll('.cancel-form').forEach(btn => {
        btn.onclick = () => {
            const p = btn.dataset.product;
            document.getElementById(`form-${p}`).style.display = 'none';
        };
    });

    // Отправка заказа
    async function sendOrder(product, name, contact, comment) {
        let productName, option, price;
        if(product === 'gta'){
            productName = 'GTA проект';
            option = 'GitHub/Tilda';
            price = '20/10';
        } else if(product === 'business'){
            productName = 'Сайт для бизнеса';
            option = 'GitHub/Tilda';
            price = '40/30';
        } else {
            productName = 'Форум';
            option = 'Обычный/Игровой';
            price = '25/35';
        }
        const ticketCode = generateCode();
        const text = `🛒 **ЗАКАЗ** от ${escapeHtml(name)}\n📞 Контакт: ${escapeHtml(contact)}\n📦 Товар: ${productName}\n💬 Комментарий: ${escapeHtml(comment)}\n🔑 Код: ${ticketCode}`;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: '🚀 cmdze_bot', text, ticket_code: ticketCode })
        });
        if(res.ok) return ticketCode;
        else return null;
    }

    document.querySelectorAll('.send-order').forEach(btn => {
        btn.onclick = async () => {
            const product = btn.dataset.product;
            const name = document.getElementById(`name-${product}`).value.trim();
            const contact = document.getElementById(`contact-${product}`).value.trim();
            const comment = document.getElementById(`comment-${product}`).value.trim();
            if(!name || !contact){ alert('Заполните имя и контакт'); return; }
            const code = await sendOrder(product, name, contact, comment);
            if(code){
                const codeDiv = document.getElementById(`code-${product}`);
                codeDiv.innerHTML = `✅ Заказ отправлен!<br>Ваш код: <strong>${code}</strong><br>Сохраните его.`;
                codeDiv.style.display = 'block';
                document.getElementById(`form-${product}`).style.display = 'none';
                // Очистка
                document.getElementById(`name-${product}`).value = '';
                document.getElementById(`contact-${product}`).value = '';
                document.getElementById(`comment-${product}`).value = '';
            } else {
                alert('Ошибка отправки');
            }
        };
    });

    // Отзывы
    async function loadReviews(){
        const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews?select=*&order=created_at.desc`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const reviews = await res.json();
        const container = document.getElementById('reviewsList');
        if(reviews.length) container.innerHTML = reviews.map(r => `<div class="review-item"><strong>${escapeHtml(r.name)}</strong><br>${escapeHtml(r.text)}<br><small>${new Date(r.created_at).toLocaleString()}</small></div>`).join('');
        else container.innerHTML = '<div>Нет отзывов</div>';
    }
    document.getElementById('reviewForm').onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('reviewName').value.trim();
        const text = document.getElementById('reviewText').value.trim();
        if(!name || !text) return alert('Заполните поля');
        await fetch(`${SUPABASE_URL}/rest/v1/reviews`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, text, created_at: new Date().toISOString() })
        });
        alert('Спасибо за отзыв!');
        document.getElementById('reviewName').value = '';
        document.getElementById('reviewText').value = '';
        loadReviews();
    };
    loadReviews();

    // Переписка
    let activeCode = null, msgInterval = null;
    async function loadMessages(code){
        const res = await fetch(`${SUPABASE_URL}/rest/v1/ticket_messages?select=*&ticket_code=eq.${code}&order=created_at.asc`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const msgs = await res.json();
        const container = document.getElementById('ticketMessages');
        if(!msgs.length){ container.innerHTML = '<div class="chat-message">Нет сообщений</div>'; document.getElementById('newMessageBlock').style.display = 'block'; return; }
        let html = '';
        for(let m of msgs){
            html += `<div class="chat-message"><strong>${m.is_admin ? 'Админ' : 'Вы'}</strong><br>${escapeHtml(m.message)}<br><small>${new Date(m.created_at).toLocaleString()}</small></div>`;
        }
        container.innerHTML = html;
        document.getElementById('newMessageBlock').style.display = 'block';
    }
    document.getElementById('loadTicketBtn').onclick = () => {
        const code = document.getElementById('ticketCodeInput').value.trim().toUpperCase();
        if(!code) return alert('Введите код');
        activeCode = code;
        loadMessages(code);
        if(msgInterval) clearInterval(msgInterval);
        msgInterval = setInterval(() => { if(activeCode) loadMessages(activeCode); }, 5000);
    };
    document.getElementById('sendMessageBtn').onclick = async () => {
        if(!activeCode) return alert('Загрузите переписку');
        const msg = document.getElementById('newMessageText').value.trim();
        if(!msg) return alert('Введите сообщение');
        await fetch(`${SUPABASE_URL}/rest/v1/ticket_messages`, {
            method: 'POST',
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticket_code: activeCode, is_admin: false, message: msg })
        });
        document.getElementById('newMessageText').value = '';
        loadMessages(activeCode);
    };

    // Онлайн-счётчик (упрощённо)
    async function onlineCount(){
        try{
            const forty = new Date(Date.now()-40000).toISOString();
            const res = await fetch(`${SUPABASE_URL}/rest/v1/online_users?select=id&last_seen=gt.${encodeURIComponent(forty)}`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            const data = await res.json();
            document.getElementById('onlineCount').innerText = data.length;
        }catch(e){}
    }
    onlineCount(); setInterval(onlineCount, 15000);
</script>
</body>
</html>
